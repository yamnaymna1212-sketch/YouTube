const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const win=(t,a,b)=>clamp((t-a)/(b-a));
function key(t,pts){ if(t<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++){ if(t<=pts[i][0]){const[t0,v0]=pts[i-1],[t1,v1]=pts[i];const u=(t-t0)/(t1-t0);return lerp(v0,v1,u*u*(3-2*u));} }
  return pts[pts.length-1][1]; }
const mix=(c1,c2,t)=>{const a=[1,3,5].map(i=>parseInt(c1.substr(i,2),16)),b=[1,3,5].map(i=>parseInt(c2.substr(i,2),16));return '#'+a.map((v,i)=>Math.round(lerp(v,b[i],t)).toString(16).padStart(2,'0')).join('');};

function proj(x,y,z){const dx=x-cam.x,dy=y-cam.y,dz=z-cam.z,cp=Math.cos(cam.p),sp=Math.sin(cam.p);
  const yr=dy*cp+dz*sp,zr=-dy*sp+dz*cp; if(zr<0.08)return null; return {x:W/2+F*dx/zr,y:CYv-F*yr/zr,s:F/zr,zr};}

function setPiece(P,o){ // o:{x,y,z,mult,level,alpha,color,dash,halo,rot,crack,dot}
  const pr=proj(o.x,o.y||0,o.z); if(!pr||o.alpha<=0.01){P.g.setAttribute('opacity',0);return null;}
  const hw=P.q?1.32:.86,dh=P.q?156:97; const k=pr.s*hw/dh*(o.mult||1);
  P.g.setAttribute('transform',`translate(${pr.x.toFixed(1)},${pr.y.toFixed(1)}) rotate(${(o.rot||0).toFixed(1)}) scale(${k.toFixed(3)})`);
  P.g.setAttribute('opacity',o.alpha.toFixed(3));
  const f=$(P.id+'_f'),lv=clamp(o.level);f.setAttribute('y',(-P.top*lv).toFixed(1));f.setAttribute('height',(P.top*lv+2).toFixed(1));
  const s=$(P.id+'_s');s.setAttribute('stroke',o.color||IV);s.setAttribute('stroke-dasharray',o.dash?'7 6':'none');
  $(P.id+'_d').setAttribute('fill',o.dot||o.color||IV);
  $(P.id+'_h').setAttribute('opacity',(o.halo||0).toFixed(3));
  if(P.q&&$(P.id+'_k'))$(P.id+'_k').setAttribute('stroke-dashoffset',(170*(1-(o.crack||0))).toFixed(1));
  return {x:pr.x,y:pr.y,k,zr:pr.zr};}

 l4:['ONE WAS A WALL STREET EXECUTIVE,','WITH EVERY DEGREE, AND EVERY TITLE.'],
 l5:['THE OTHER PUMPED GAS,','AND SWEPT FLOORS.'],

const capSegs=[];
for(const k in CAPS){const lines=CAPS[k],words=[];lines.forEach((l,li)=>l.split(' ').forEach(w=>words.push({w,li})));
  const wt=words.map(o=>o.w.length+2+(/[.,]$/.test(o.w)?3:0)),tot=wt.reduce((a,b)=>a+b,0);
  const [s,d]=VO[k];let acc=0;words.forEach((o,i)=>{o.t0=s+d*acc/tot;acc+=wt[i];o.t1=s+d*acc/tot;});
  const g=el('g',{opacity:0},$('capL')),lh=64,y0=1500-(lines.length-1)*lh/2,tsp=[];
  lines.forEach((l,li)=>{const t=el('text',{x:540,y:y0+li*lh,'text-anchor':'middle','font-size':44,'font-weight':800,'letter-spacing':1},g);

/* ------------ network (screen-space threads) ------------ */
const netL=$('netL');
function thread(d,col,dash,w){const p=el('path',{d,fill:'none',stroke:col,'stroke-width':w||3,'stroke-linecap':'round'},netL);p._L=1200;p.setAttribute('stroke-dasharray',dash?dash:'1200');p.setAttribute('stroke-dashoffset',1200);p._dash=dash;return p;}
function drawThread(p,u,op){const L=p._L;if(p._dash){p.setAttribute('stroke-dasharray',p._dash);p.style.clipPath='none';p.setAttribute('opacity',(op??1)*clamp(u*2));}
  else{p.setAttribute('stroke-dashoffset',(L*(1-u)).toFixed(1));p.setAttribute('opacity',op??1);}}

/* ------------ pawn / queen kinematics ------------ */
function pawnPos(t){let z=1.5,hop=0;STEPS.forEach(ts=>{const u=clamp((t-ts)/.3);z+=eio(u);if(u>0&&u<1)hop=Math.max(hop,Math.sin(Math.PI*u)*.28);});return {x:1.5,z,hop};}
function shakeAmt(t){let a=0;HITS.forEach(h=>{if(t>=h)a+=Math.exp(-(t-h)*7)*(h===30.55?1.4:1);});return a;}

/* ------------ main render ------------ */
window.renderAt=function(t){
  CYv=key(t,[[0,1010],[12.2,1010],[13.2,900],[19.8,860],[24.5,900],[28,900],[31,960],[33,1010]]);
  // camera
  const sh=shakeAmt(t),ns=Math.sin(t*2.3)*.012+Math.sin(t*5.1)*.006;
  cam.x=key(t,[[0,0],[4.6,.3],[13,0],[19.8,.7],[28,.9],[31,.4],[35,0]])+Math.sin(t*37)*.035*sh;
  cam.y=key(t,[[0,.9],[4.6,1.05],[5.3,2.4],[12.2,2.6],[13.2,3.6],[16.5,3.4],[19.8,3.2],[24.5,3.3],[28,3.0],[30.6,2.7],[31.6,3.6],[35,5.5]])+Math.cos(t*41)*.03*sh;
  cam.z=key(t,[[0,-1.2],[4.6,-.4],[5.3,-.6],[12.2,-.2],[13.2,-.5],[16.5,1.0],[19.8,.8],[24.6,.8],[28,3.0],[30.6,4.6],[31.6,3.8],[35,1.5]]);
  cam.p=key(t,[[0,.12],[4.6,.17],[5.3,.5],[12.2,.55],[13.2,.78],[16.5,.8],[19.8,.72],[24.5,.64],[28,.56],[30.6,.5],[31.6,.7],[35,1.0]])+ns+Math.sin(t*29)*.006*sh;
  const bAlpha=key(t,[[0,0],[.8,1],[5.0,1],[5.4,.3],[12.2,.3],[12.8,1],[20.0,1],[20.4,.22],[24.4,.22],[24.9,1],[31.5,1],[33.4,0],[35,0]]);
  // board
  const g=[];for(let i=0;i<=8;i++){g[i]=[];for(let j=0;j<=8;j++)g[i][j]=proj(i-4,0,j);}
  const polyPts=(i,j)=>{const a=g[i][j],b=g[i+1][j],c=g[i+1][j+1],d=g[i][j+1];if(!a||!b||!c||!d)return null;return `${a.x.toFixed(1)},${a.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)} ${c.x.toFixed(1)},${c.y.toFixed(1)} ${d.x.toFixed(1)},${d.y.toFixed(1)}`;};
  let n=0;for(let i=0;i<8;i++)for(let j=0;j<8;j++){const p=polyPts(i,j),e=sq[n++];if(!p){e.setAttribute('opacity',0);continue;}
    const zr=g[i][j].zr,fade=clamp(1.15-zr/20);e.setAttribute('points',p);e.setAttribute('fill',(i+j)%2?'#1b1b1f':'#0f0f11');e.setAttribute('opacity',(bAlpha*fade).toFixed(3));}
  const pw=pawnPos(t);
  for(let j=0;j<8;j++){const p=polyPts(5,j),e=hl[j];if(!p){e.setAttribute('opacity',0);continue;}e.setAttribute('points',p);
    const vis=j<Math.floor(pw.z-.5+.001)?.16:(j===Math.floor(pw.z)?.30+.1*Math.sin(t*6):0);const onT=(t>16.8&&t<31.8)?1:0;e.setAttribute('opacity',(vis*onT*bAlpha).toFixed(3));}
  const ep=[g[0][0],g[8][0],g[8][8],g[0][8]];if(ep.every(Boolean)){edge.setAttribute('points',ep.map(q=>q.x.toFixed(1)+','+q.y.toFixed(1)).join(' '));edge.setAttribute('opacity',bAlpha);}else edge.setAttribute('opacity',0);

  H1.setAttribute('transform',`translate(0,${rise1.toFixed(1)}) translate(540,400) scale(${(1+.05*eob(win(t,.2,.9))).toFixed(3)}) translate(-540,-400)`);H1b.setAttribute('transform',`translate(0,${rise1.toFixed(1)})`);

  SUB.setAttribute('opacity',eo(win(t,33.3,33.8)).toFixed(3));BRAND.setAttribute('opacity',eo(win(t,33.8,34.3)).toFixed(3));LOGO.setAttribute('opacity',eo(win(t,34.0,34.5)).toFixed(3));

    const q=proj(.85,.1,1.5+o.i+1);if(q&&a>0){o.g.setAttribute('transform',`translate(${q.x.toFixed(0)},${(q.y-q.s*.3).toFixed(0)})`);o.g.setAttribute('opacity',(a*bAlpha).toFixed(3));}else o.g.setAttribute('opacity',0);});

      o.th.setAttribute('d',d);o.th2.setAttribute('d',d);o.th.setAttribute('opacity',(u*off).toFixed(3));o.th2.setAttribute('opacity',(u*off*(.5+.5*Math.sin(t*5+i))).toFixed(3));}

  const bt=t-30.55;rings.forEach((r,i)=>{const u=clamp((bt-i*.12)/.9);const c=rq||{x:540,y:1100,k:1};if(bt>=0&&u<1&&rq){r.setAttribute('cx',rq.x);r.setAttribute('cy',rq.y-rq.k*80);r.setAttribute('r',(40+u*520).toFixed(0));r.setAttribute('opacity',((1-u)*.8).toFixed(3));r.setAttribute('stroke-width',(8*(1-u)+1).toFixed(1));}else r.setAttribute('opacity',0);});
  rays.forEach((r,i)=>{const a=i/rays.length*Math.PI*2,u=clamp(bt/1.0);if(bt>=0&&u<1&&rq){const cx=rq.x,cy=rq.y-rq.k*80,r0=70+u*200,r1=r0+60+u*260*(i%3?1:1.6);r.setAttribute('x1',(cx+Math.cos(a)*r0).toFixed(0));r.setAttribute('y1',(cy+Math.sin(a)*r0).toFixed(0));r.setAttribute('x2',(cx+Math.cos(a)*r1).toFixed(0));r.setAttribute('y2',(cy+Math.sin(a)*r1).toFixed(0));r.setAttribute('opacity',((1-u)*.9).toFixed(3));}else r.setAttribute('opacity',0);});
  let fl=Math.max(win(t,30.5,30.56)*(1-win(t,30.56,30.9))*.5,win(t,24.22,24.28)*(1-win(t,24.28,24.6))*.25,win(t,4.68,4.72)*(1-win(t,4.72,4.85))*.2,win(t,3.12,3.16)*(1-win(t,3.16,3.5))*.18);
  flash.setAttribute('opacity',fl.toFixed(3));
  // end echo rings
  eRings.forEach((r,i)=>{const t0=[33.05,33.6,34.15][i],u=clamp((t-t0)/.9);if(u>0&&u<1){r.setAttribute('cx',540);r.setAttribute('cy',960);r.setAttribute('r',(160+u*620).toFixed(0));r.setAttribute('opacity',((1-u)*.45).toFixed(3));}else r.setAttribute('opacity',0);});
};
