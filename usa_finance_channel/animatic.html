<!doctype html>
<html><head><meta charset="utf-8"><title>Stair Stories - Ep01 animatic v2</title>
<style>
html,body{margin:0;background:#000}
#c{width:1080px;height:1920px;position:relative;overflow:hidden}
svg{position:absolute;left:0;top:0}
#grain{position:absolute;left:0;top:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.28;pointer-events:none}
</style></head><body>
<div id="c"><svg id="s" viewBox="0 0 1080 1920" width="1080" height="1920"></svg><img id="grain" src="grain.png"></div>
<script>
const SCENE_LEN = 5;
const RED='#ff4655', GREEN='#2cff8f', WHITE='#ffffff';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eo=x=>1-Math.pow(1-clamp(x,0,1),3);
const eb=x=>{x=clamp(x,0,1);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const hs=a=>{const x=Math.sin(a*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
const fmt=v=>'$'+Math.round(v).toLocaleString('en-US');

/* ---------- paper cut-out primitives ---------- */
const jit=(pts,seed,amt)=>pts.map((p,i)=>[p[0]+(hs(seed+i*3.1)-.5)*2*amt,p[1]+(hs(seed+i*7.7+1)-.5)*2*amt]);
const path=pts=>'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')+'Z';
function cut(pts,fill,o={}){
  const seed=o.seed||(pts[0][0]*.13+pts[0][1]*.07+pts.length);
  const d=path(jit(pts,seed,o.j===undefined?2:o.j));
  const sh=o.sh===undefined?1:o.sh;
  return (sh?`<path d="${d}" transform="translate(${5*sh},${8*sh})" fill="#000" opacity=".36"/>`:'')+
    `<path d="${d}" fill="${fill}" stroke="${o.edge||'rgba(255,255,255,.2)'}" stroke-width="${o.sw||2.2}" stroke-linejoin="round"/>`;
}
const rect=(x,y,w,h,f,o)=>cut([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],f,o);
function blob(cx,cy,r,f,o={}){const n=o.n||18,ry=o.ry||1,p=[];for(let i=0;i<n;i++){const a=i/n*6.2832;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r*ry])}return cut(p,f,o)}
const txt=(s,x,y,size,fill,o={})=>`<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${o.a||'middle'}" font-family="${o.f||'DejaVu Sans'}" font-weight="900" ${o.x||''}>${s}</text>`;
function neon(s,x,y,size,col,op){
  return `<g opacity="${op}">`+txt(s,x,y,size,col,{x:'filter="url(#glow)" opacity=".95"'})+txt(s,x,y,size,'#fff',{x:`stroke="${col}" stroke-width="${size*.035}"`})+`</g>`;
}
const cone=(x1,y1,x2,y2,x3,y3,op=1)=>`<path d="M${x1},${y1}L${x2},${y2}L${x3},${y3}Z" fill="url(#cone)" opacity="${op}"/>`;

/* ---------- characters: paper body, real American head ---------- */
function arm(sx,sy,hx,hy,fill,skin){
  const dx=hx-sx,dy=hy-sy,l=Math.hypot(dx,dy)||1,nx=-dy/l*13,ny=dx/l*13;
  return cut([[sx+nx,sy+ny],[hx+nx*.8,hy+ny*.8],[hx-nx*.8,hy-ny*.8],[sx-nx,sy-ny]],fill,{j:1.2})+blob(hx,hy,16,skin,{n:10,j:1,sh:.6});
}
function head(o){
  const e=o.expr||'neutral',skin=o.skin,shade=o.shade||'#c98f6a',hair=o.hair;
  const ink='#1d1512';
  let g=`<g transform="translate(0,-432) rotate(${o.tilt||0})">`;
  if(o.long)g+=cut([[-66,-60],[-48,-92],[0,-100],[48,-92],[66,-60],[70,40],[62,86],[-62,86],[-70,40]],hair,{j:1.5,seed:5});
  g+=blob(-58,6,13,skin,{n:10,j:.6,sh:.4})+blob(58,6,13,skin,{n:10,j:.6,sh:.4});
  g+=cut([[-54,-48],[-50,-10],[-42,34],[-24,62],[0,70],[24,62],[42,34],[50,-10],[54,-48],[40,-66],[0,-72],[-40,-66]],skin,{j:1.2,seed:9});
  if(o.long){
    g+=cut([[-58,-60],[-30,-76],[0,-80],[30,-76],[58,-60],[54,-20],[34,-44],[0,-52],[-34,-44],[-54,-20]],hair,{sh:0,j:1,seed:6});
  } else {
    g+=cut([[-58,-12],[-62,-46],[-46,-76],[-14,-90],[22,-88],[50,-72],[62,-40],[58,-10],[50,-34],[28,-54],[-22,-48],[-46,-26]],hair,{sh:.4,j:1.2,seed:7});
  }
  const eye=x=>`<ellipse cx="${x}" cy="-6" rx="11" ry="7.5" fill="#fff"/><circle cx="${x}" cy="-5" r="5" fill="#3a2a1f"/><circle cx="${x}" cy="-5" r="2.2" fill="${ink}"/>`;
  g+=eye(-22)+eye(22);
  const br=(x1,y1,x2,y2)=>`<path d="M${x1},${y1}L${x2},${y2}" stroke="${o.brow||'#2a1b12'}" stroke-width="6.5" stroke-linecap="round"/>`;
  g+=cut([[-4,-6],[-12,24],[0,30],[12,24],[4,-6]],shade,{sh:0,j:.6,edge:'none',seed:3});
  if(e==='worry'){g+=br(-36,-22,-12,-32)+br(12,-32,36,-22)+`<path d="M-17,50 Q0,38 17,50" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round"/>`}
  else if(e==='smile'){g+=br(-36,-26,-12,-28)+br(12,-28,36,-26)+`<path d="M-22,40 Q0,64 22,40 Z" fill="#fff" stroke="${ink}" stroke-width="4.5" stroke-linejoin="round"/>`}
  else {g+=br(-36,-26,-12,-26)+br(12,-26,36,-26)+`<path d="M-14,48 L14,48" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>`}
  return g+'</g>';
}
function person(x,y,s,o={}){
  const t=o.t||0,j=o.jacket||'#d9622b',pn=o.pants||'#27406e',sk=o.skin||'#e8b894',hr=o.hair||'#4a2f1d',pose=o.pose||'stand';
  const sway=Math.sin(t*2.2)*1.6,bob=o.walk?Math.abs(Math.sin(t*7))*-10:0;
  let L=[-78,-205],R=[78,-205];
  if(pose==='hands_head'){L=[-78,-440];R=[78,-440]}
  else if(pose==='wave'){L=[-84,-215];R=[96,-400+Math.sin(t*8)*18]}
  else if(pose==='look'){L=[-78,-205];R=[70,-300]}
  let g=`<g transform="translate(${x},${y+bob}) scale(${o.flip?-s:s},${s}) rotate(${sway*.4})">`;
  const step=o.walk?Math.sin(t*7)*22:0;
  if(!o.sit){g+=rect(-42+step,-192,36,192,pn)+rect(6-step,-192,36,192,pn)+rect(-54+step,-14,56,18,'#16161d')+rect(0-step,-14,56,18,'#16161d')}
  g+=cut([[-60,-342],[60,-342],[68,-180],[-68,-180]],j);
  g+=arm(-56,-326,L[0],L[1],j,sk)+arm(56,-326,R[0],R[1],j,sk);
  g+=rect(-16,-384,32,50,o.shade||'#c98f6a',{sh:.3,j:1});
  g+=head({skin:sk,shade:o.shade,hair:hr,brow:o.brow,expr:o.expr,tilt:o.tilt===undefined?Math.sin(t*1.7)*2:o.tilt,long:o.long});
  return g+'</g>';
}

/* ---------- set pieces ---------- */
function skyline(off,base,col,seed,hmin,hmax,wmin){
  let s='',x=-200+off,i=0;
  while(x<1300){const w=wmin+hs(seed+i)*60,h=hmin+hs(seed+i+40)*(hmax-hmin);
    s+=rect(x,base-h,w,h+400,col,{sh:0,j:1.5,seed:seed+i});x+=w+8;i++}
  return s;
}
function lampPost(x,top,base,flick){
  return rect(x-10,top,20,base-top,'#14121f')+rect(x-150,top-6,160,16,'#14121f')+blob(x-150,top+6,24,'#ffe3a8',{n:10,sh:.4})+
    `<circle cx="${x-150}" cy="${top+6}" r="58" fill="#ffc26b" opacity="${.25*flick}" filter="url(#glow)"/>`+cone(x-150,top+20,x-300,base-20,x,base-20,flick);
}

/* ---------- amount + arrow (no box) and captions ---------- */
function amount(val,t,o){
  const col=o.good?GREEN:RED,size=180,s=fmt(val);
  const digits=(s.match(/\d/g)||[]).length,commas=(s.match(/,/g)||[]).length;
  const w=size*(.696*(digits+1)+.38*commas);
  const k=o.dir==='up'?-1:1;
  const ax=540-w/2-78+40,ay=215+(o.moving?Math.sin(t*14)*7:0)*k*-1;
  const arrow=`<path d="M${ax},${ay+k*56} L${ax+54},${ay+k*-2} L${ax+20},${ay+k*-2} L${ax+20},${ay+k*-56} L${ax-20},${ay+k*-56} L${ax-20},${ay+k*-2} L${ax-54},${ay+k*-2} Z" fill="${col}" stroke="#000" stroke-opacity=".5" stroke-width="5" stroke-linejoin="round"/>`;
  const num=`<text x="580" y="270" font-size="${size}" text-anchor="middle" font-family="DejaVu Sans" font-weight="900" fill="${col}" stroke="#000" stroke-width="14" paint-order="stroke" stroke-linejoin="round">${s}</text>`;
  return arrow+num;
}
function caption(lines,t,hl){
  let out=`<rect x="0" y="1450" width="1080" height="470" fill="url(#capbar)"/>`,wi=0;
  const size=Math.max(58,Math.min(100,...lines.map(l=>Math.floor(980/(l.length*.74)))));
  lines.forEach((ln,li)=>{
    const words=ln.split(' ');let ts='';
    words.forEach((w,k)=>{const st=.5+wi*.2;wi++;const a=clamp((t-st)/.14,0,1);
      ts+=`<tspan fill="${hl[w]||WHITE}" fill-opacity="${a}" stroke-opacity="${a}">${w}${k<words.length-1?' ':''}</tspan>`});
    out+=`<text x="540" y="${1660+li*(size+22)}" font-size="${size}" text-anchor="middle" font-family="DejaVu Sans" font-weight="900" stroke="#000" stroke-width="16" paint-order="stroke" stroke-linejoin="round">${ts}</text>`;
  });
  return out;
}
const cam=(art,t,o={})=>{const z0=o.z0||1,z1=o.z1||1.07,fx=o.fx||540,fy=o.fy||900,k=clamp(t/SCENE_LEN,0,1),z=z0+(z1-z0)*k,dx=(o.dx||0)*k;
  return `<g transform="translate(${fx},${fy}) scale(${z}) translate(${-fx+dx},${-fy})">${art}</g>`};

/* ---------- scenes ---------- */
const MARCUS={jacket:'#d9622b',pants:'#27406e',skin:'#e8b894',shade:'#cf9a74',hair:'#4a2f1d'};

function scene1(t){ // THE CAR DIED
  const fl=hs(Math.floor(t*14))>.93?.55:1;
  let a=`<rect width="1080" height="1920" fill="url(#skyA)"/>`;
  a+=skyline(-t*6,1230,'#1c1546',1,160,420,90);
  a+=rect(-40,1230,1160,120,'#3a3350',{sh:0,j:1})+rect(-40,1350,1160,300,'#17141f',{sh:0,j:1});
  a+=lampPost(960,650,1330,fl);
  // small flyer on the pole - planted for the payoff in scene 4
  a+=rect(150,830,20,500,'#14121f')+rect(108,900,104,130,'#f4efe0',{j:1.5})+rect(108,900,104,30,GREEN,{sh:0,j:1});
  const cx=400,cy=1340;
  const steam=[0,1,2,3,4].map(i=>{const p=((t*.45+i*.2)%1);return `<circle cx="${cx+150+Math.sin(p*7+i)*26}" cy="${cy-150-p*300}" r="${20+p*58}" fill="#dfe6f2" opacity="${(1-p)*.55}"/>`}).join('');
  a+=`<g transform="translate(${cx},${cy})">`+
    cut([[-270,0],[270,0],[282,-70],[240,-100],[140,-110],[80,-196],[-110,-196],[-185,-112],[-262,-96],[-282,-58]],'#1fa3a8')+
    cut([[-92,-182],[70,-182],[120,-112],[-150,-112]],'#9fd9e8',{sh:0})+
    `<g transform="rotate(${-52+Math.sin(t*3)*1.5} 150 -118)">`+rect(150,-132,150,18,'#1a8a90')+`</g>`+
    blob(-150,0,58,'#15131c',{n:16})+blob(-150,0,24,'#8c8aa8',{n:10,sh:0})+blob(165,0,58,'#15131c',{n:16})+blob(165,0,24,'#8c8aa8',{n:10,sh:0})+
    `</g>`+steam;
  a+=person(800,1345,1.35,{...MARCUS,t,pose:'hands_head',expr:'worry'});
  return {art:cam(a,t,{z1:1.08,fx:700,fy:1000,dx:-30}),
    amt:{val:1400*eo((t-.3)/1.3),dir:'up',good:false,moving:t>.3&&t<1.6},
    cap:['THE BILL: $1,400'],hl:{'$1,400':RED}};
}

function scene2(t){ // PAYDAY LOAN
  const fl=hs(Math.floor(t*10))>.9?.4:1;
  let a=`<rect width="1080" height="1920" fill="url(#skyA)"/>`;
  a+=skyline(-t*5,1100,'#1c1546',7,180,420,80);
  a+=rect(-40,1300,1160,120,'#3a3350',{sh:0,j:1})+rect(-40,1420,1160,300,'#17141f',{sh:0,j:1});
  a+=rect(130,600,820,720,'#3b2a5e')+rect(210,660,660,150,'#0c0a16');
  a+=neon('CASH NOW',540,775,118,'#ff3fa4',fl);
  for(let i=0;i<10;i++)a+=cut([[150+i*80,830],[230+i*80,830],[236+i*80,900],[144+i*80,900]],i%2?'#f2e6c9':'#d6342f',{sh:.4,j:1});
  a+=rect(170,930,420,290,'#0f0d1f')+`<rect x="180" y="940" width="400" height="270" fill="#ffd27a" opacity=".14"/>`;
  a+=rect(660,930,230,390,'#17142a')+`<rect x="672" y="942" width="206" height="366" fill="#ffd27a" opacity=".3"/>`+cone(676,1318,640,1500,900,1500,.5);
  const walking=t<2.4,wx=-120+Math.min(t/2.4,1)*895;
  a+=person(wx,1410,1.35,{...MARCUS,t,pose:walking?'stand':'look',walk:walking,expr:t<2.6?'worry':'neutral'});
  const k=eb((t-2.6)/.6);
  if(t>2.6)for(let i=0;i<3;i++)a+=`<g transform="translate(${660+i*14},${1380-k*60-i*16}) rotate(${-6+i*5})">`+rect(0,0,120,56,'#3fbf6f',{j:1})+blob(60,28,16,'#2a9a56',{n:10,sh:0,edge:'none'})+`</g>`;
  return {art:cam(a,t,{z1:1.07,fx:540,fy:1000,dx:-20}),
    amt:{val:500*eo((t-2.6)/1.0),dir:'up',good:true,moving:t>2.6&&t<3.6},
    cap:['$500 IN 10 MINUTES','$75 FEE / 2 WEEKS'],hl:{'$500':GREEN,'$75':RED}};
}

function scene3(t){ // THE STAIRCASE OF FEES
  let a=`<rect width="1080" height="1920" fill="url(#skyA)"/>`;
  a+=rect(-40,1380,1160,300,'#17141f',{sh:0,j:1});
  const cols=['#f7d154','#f5b83d','#f29a33','#ee7a33','#e75a38','#d9383c'];
  let fees=0;
  for(let i=0;i<6;i++){
    const x=215+i*122,top=1380-i*125;
    a+=rect(x,top,150,1500-top,cols[i],{seed:20+i});
    const st=.5+i*.6,k=eb((t-st)/.5);
    if(t>st){fees=75*(i+1);
      a+=`<g transform="translate(${x+75},${top-95-(1-k)*500}) rotate(${(i%2?4:-4)})">`+rect(-62,-34,124,74,'#f6f1e6',{j:1.5})+txt('$75',0,26,50,RED)+`</g>`}
  }
  a+=person(110,1395,1.0,{...MARCUS,t,pose:'look',expr:'worry'});
  return {art:cam(a,t,{z1:1.06,fx:600,fy:1000,dx:-20}),
    amt:{val:fees,dir:'up',good:false,moving:t>.5&&t<4.2},
    cap:['ROLLED OVER 6 TIMES','$450 IN FEES'],hl:{'$450':RED}};
}

function scene4(t){ // LOW POINT + THE FLYER
  let a=`<rect width="1080" height="1920" fill="#1a1430"/>`;
  a+=rect(-20,1480,1120,300,'#2a1d1a',{sh:0,j:1});
  a+=rect(640,500,360,420,'#a9743f',{seed:90})+rect(650,510,340,400,'#bf8a4e',{sh:0,j:1});
  a+=`<g transform="translate(700,560) rotate(-5)">`+rect(0,0,110,130,'#f6f1e6',{j:1})+rect(0,0,110,22,RED,{sh:0})+`</g>`;
  a+=`<g transform="translate(850,640) rotate(6)">`+rect(0,0,110,120,'#f6f1e6',{j:1})+rect(0,0,110,22,RED,{sh:0})+`</g>`;
  const pul=t>1.8?(.5+.5*Math.sin(t*6)):0;
  a+=`<g transform="translate(690,730) rotate(-2)"><rect x="-14" y="-14" width="248" height="162" rx="10" fill="${GREEN}" opacity="${.5*pul}" filter="url(#glow)"/>`+
     rect(0,0,220,134,'#f4efe0',{j:1.2})+rect(0,0,220,40,'#18b66a',{sh:0})+`</g>`;
  a+=rect(374,300,8,330,'#0e0c18',{sh:0})+blob(378,640,46,'#ffe3a8',{n:12,sh:.4,ry:.7})+
     `<circle cx="378" cy="650" r="90" fill="#ffc26b" opacity=".28" filter="url(#glow)"/>`+cone(378,660,60,1250,700,1250,.85);
  a+=rect(70,1000,300,520,'#2a1f3a',{sh:0,j:1});
  a+=person(300,1260,1.32,{...MARCUS,t,pose:'hands_head',expr:'worry',sit:true,tilt:6});
  a+=rect(40,1210,760,70,'#7b4d26')+rect(90,1280,40,260,'#5c3a1c')+rect(710,1280,40,260,'#5c3a1c');
  [[140,1180,-8],[300,1170,5],[470,1186,-4],[610,1176,9]].forEach(b=>{a+=`<g transform="translate(${b[0]},${b[1]}) rotate(${b[2]})">`+rect(0,0,120,48,'#f6f1e6',{j:1,sh:.6})+`</g>`});
  const f=clamp((t-2.0)/3,0,1);
  return {art:cam(a,t,{z0:1,z1:1.28,fx:430+f*320,fy:900-f*150}),
    amt:{val:450+500*eo((t-.3)/1.3),dir:'up',good:false,moving:t>.3&&t<1.6},
    cap:['STILL OWES $500'],hl:{'$500':RED}};
}

function scene5(t){ // RELIEF
  let a=`<rect width="1080" height="1920" fill="url(#skyB)"/>`;
  a+=rect(100,430,880,150,'#06241f')+neon('CREDIT UNION',540,542,104,GREEN,1);
  a+=rect(-20,1060,1120,640,'#0f2f2a',{sh:0,j:1});
  a+=person(850,1215,1.05,{jacket:'#1f6f9a',pants:'#1b2a44',skin:'#c68a64',shade:'#a96e4c',hair:'#2a1a12',brow:'#1d120c',t,pose:'wave',expr:'smile',long:true});
  a+=rect(60,1100,960,90,'#a86d32')+rect(60,1190,960,420,'#8a5a2b');
  for(let i=0;i<5;i++)a+=rect(90+i*190,1220,160,330,'#7a4f25',{sh:0,j:1,seed:70+i});
  a+=person(300,1500,1.4,{...MARCUS,t,pose:'wave',expr:t>1.2?'smile':'neutral'});
  const v=950*(1-eo((t-1.2)/1.8));
  return {art:cam(a,t,{z1:1.06,fx:540,fy:1000}),
    amt:{val:v,dir:'down',good:true,moving:t>1.2&&t<3.0},
    cap:['SAME $500','CAPPED AT 28% APR'],hl:{'28%':GREEN}};
}

const SCENES=[scene1,scene2,scene3,scene4,scene5];
const DEFS=`<defs>
<linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0f2c"/><stop offset=".6" stop-color="#2b1250"/><stop offset="1" stop-color="#7a2a4a"/></linearGradient>
<linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06222a"/><stop offset=".6" stop-color="#0f4a4a"/><stop offset="1" stop-color="#2f8a6a"/></linearGradient>
<linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc26b" stop-opacity=".6"/><stop offset="1" stop-color="#ffc26b" stop-opacity="0"/></linearGradient>
<linearGradient id="capbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>`;

function render(T){
  const i=clamp(Math.floor(T/SCENE_LEN),0,SCENES.length-1),t=T-i*SCENE_LEN;
  const sc=SCENES[i](t);
  const fade=clamp(t/.3,0,1)*clamp((SCENE_LEN-t)/.15,0,1);
  document.getElementById('s').innerHTML=DEFS+`<g opacity="${fade}">`+sc.art+`<rect width="1080" height="1920" fill="url(#vig)"/>`+
    amount(sc.amt.val,t,sc.amt)+caption(sc.cap,t,sc.hl)+`</g>`;
}
window.render=render;window.SCENE_LEN=SCENE_LEN;window.N=SCENES.length;
render(0);
</script></body></html>
